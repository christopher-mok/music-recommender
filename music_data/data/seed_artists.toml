# Pipeline settings
[collect]
tracks_per_artist = 5
similar_limit = 50
resume = false

[database]
path = "data/music_metadata_100.db"

[http]
timeout = 30.0
max_retries = 5
retry_delay = 1.0

[cache]
enabled = true
read = true
write = true
directory = ".cache/music_data"
ttl_seconds = 0

[listenbrainz]
enabled = true
similar_limit = 50

# Last.fm is optional and disabled by default. Consult its terms before caching
# or redistributing any Last.fm-derived data.
[lastfm]
enabled = false

# MusicBrainz User-Agent is read from MUSICBRAINZ_USER_AGENT in .env.
# Do not commit a contact address in this tracked seed file.
[musicbrainz]
enabled = true
rate_limit = 1.0
