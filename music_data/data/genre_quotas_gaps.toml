# Growth pass 2026-11-13: fill genres/regions that were thin or empty in
# music_metadata_100.db (counts = seeded artists with that genre, weight>=0.3).
# Thinnest gaps get the largest counts. Use with --skip-collected.
# Rock/metal/emo/shoegaze slots removed per user (already well covered).
# Run: collect --quotas data/genre_quotas_gaps.toml --popular N --popular-range month --skip-collected

default_count = 12

# --- North America: big streaming genres that were under-weighted --------
[[slots]]
name = "country (modern, 2005+)"       # had 15
query = '(tag:country OR tag:"contemporary country" OR tag:"country pop") AND begin:[2005 TO *]'
count = 27

[[slots]]
name = "red dirt / americana"
query = 'tag:americana OR tag:"red dirt" OR tag:"alt-country"'
count = 12

[[slots]]
name = "regional mexican / corridos"    # had 6 / 2
query = 'tag:"corridos tumbados" OR tag:corrido OR tag:"regional mexican" OR tag:"música mexicana" OR tag:banda OR tag:sierreño'
count = 27

[[slots]]
name = "gospel / ccm / worship"         # had 2 / 0
query = 'tag:"contemporary christian" OR tag:"christian pop" OR tag:worship OR tag:"contemporary gospel"'
count = 22

# --- Latin beyond reggaeton ----------------------------------------------
[[slots]]
name = "bachata / salsa / merengue"     # had 0-1
query = 'tag:bachata OR tag:salsa OR tag:merengue'
count = 20

[[slots]]
name = "cumbia / latin alternative"
query = 'tag:cumbia OR tag:"latin alternative" OR tag:"rock en español"'
count = 14

# --- Hip hop / rap subgenres ---------------------------------------------
[[slots]]
