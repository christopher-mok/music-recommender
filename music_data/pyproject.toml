[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-data-pipeline"
version = "0.1.0"
description = "Collect music metadata, tracks, and similarity relationships into SQLite"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "click>=8.1",
    "python-dotenv>=1.0",
    "numpy>=1.26",  # publish + music_data.api
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "tomli-w>=1.0",
]
# Visualizer: standalone read-only web UI (streamlit-based)
viz = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]

# torch: install the CUDA build first, e.g.
#   pip install torch torchaudio torchvision --index-url https://download.pytorch.org/whl/cu128
embed = [
    "numpy>=2.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sentence-transformers>=5",
    "transformers>=5",          # EmbeddingGemma 2
]
# MuQ 0.1.0 breaks on transformers 5.x -> use a separate venv (.venv-muq)
muq = [
    "numpy>=2.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "muq>=0.1",
    "transformers>=4.45,<5",
]

[project.scripts]
music-data = "music_data.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_data = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
